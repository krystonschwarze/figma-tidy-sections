<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tidy Sections</title>
    <!--inject:css-->
  </head>
  <body>
    <div class="fig-empty" id="emptyView" hidden>
      <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect
          x="3"
          y="3"
          width="22"
          height="22"
          rx="5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-dasharray="3 2.5"
        />
        <path
          d="M10 14h8M14 10v8"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <p class="fig-empty__text" id="emptyMessage">Select a section to organize.</p>
      <button type="button" class="fig-link" id="emptySettings">Settings</button>
    </div>

    <div class="fig-view" id="mainView" hidden>
      <header class="fig-header">
        <span class="fig-header__dot" aria-hidden="true"></span>
        <h1 class="fig-header__title" id="sectionName">Section</h1>
        <span class="fig-header__meta" id="sectionCount">0 items</span>
        <button type="button" class="fig-btn fig-btn--icon" id="openSettings" title="Settings">
          <span class="fig-sr-only">Settings</span>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2" />
            <circle cx="7" cy="7" r="1.5" fill="currentColor" />
            <path
              d="M7 2v1.5M7 10.5V12M2 7h1.5M10.5 7H12M3.8 3.8l1.1 1.1M9.1 9.1l1.1 1.1M3.8 10.2l1.1-1.1M9.1 4.9l1.1-1.1"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="fig-body">
        <section class="fig-group">
          <div class="fig-label" id="directionLabel">Direction</div>
          <div class="fig-segmented" id="directionGroup" aria-labelledby="directionLabel">
            <button class="fig-segment" data-value="horizontal" title="Horizontal">
              <span class="fig-sr-only">Horizontal</span>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M3 8h10M10 5l3 3-3 3"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="fig-segment" data-value="vertical" title="Vertical">
              <span class="fig-sr-only">Vertical</span>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M8 3v10M5 10l3 3 3-3"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="fig-segment" data-value="grid" title="Grid">
              <span class="fig-sr-only">Grid</span>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="3"
                  y="3"
                  width="4"
                  height="4"
                  rx=".5"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <rect
                  x="9"
                  y="3"
                  width="4"
                  height="4"
                  rx=".5"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <rect
                  x="3"
                  y="9"
                  width="4"
                  height="4"
                  rx=".5"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <rect
                  x="9"
                  y="9"
                  width="4"
                  height="4"
                  rx=".5"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
              </svg>
            </button>
            <button class="fig-segment" data-value="auto" title="Keep current rows">
              <span class="fig-sr-only">Keep current rows</span>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M8 2l1.5 3.5L13 7l-3.5 1.5L8 12l-1.5-3.5L3 7l3.5-1.5L8 2z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </section>

        <section class="fig-group">
          <div class="fig-label" id="alignLabel">Alignment</div>
          <div class="align-row">
            <div
              class="align-grid"
              id="alignGrid"
              role="radiogroup"
              aria-labelledby="alignLabel"
              data-h="center"
              data-v="center"
            ></div>
            <div class="fig-stack align-side">
              <div class="fig-segmented" id="sizingGroup" aria-label="Section size">
                <button class="fig-segment align-side__segment" data-value="hug">Hug</button>
                <button class="fig-segment align-side__segment" data-value="fixed">Fixed</button>
              </div>
              <p class="fig-hint" id="sizingHint"></p>
            </div>
          </div>
        </section>

        <section class="fig-group">
          <label class="fig-label" for="gap">Gap</label>
          <div class="fig-row">
            <div class="fig-field">
              <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path
                  d="M1 4h12M1 10h12"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
                <path d="M7 6v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                <path
                  d="M6 6.5 7 5.5l1 1M6 7.5 7 8.5l1-1"
                  stroke="currentColor"
                  stroke-width=".9"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <input type="number" id="gap" min="0" max="2000" step="8" />
            </div>
          </div>
          <div class="fig-chip-row" id="gapChips"></div>
        </section>

        <section class="fig-group">
          <div class="fig-label-row">
            <span class="fig-label">Padding</span>
            <button
              type="button"
              class="fig-btn fig-btn--icon"
              id="padModeToggle"
              aria-pressed="false"
              title="Set each side separately"
            >
              <span class="fig-sr-only">Set each side separately</span>
              <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect
                  x="2"
                  y="2"
                  width="10"
                  height="10"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-dasharray="2.5 2"
                />
              </svg>
            </button>
          </div>

          <div class="fig-stack" id="padSingle">
            <div class="fig-row">
              <div class="fig-field">
                <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <rect
                    x="2"
                    y="2"
                    width="10"
                    height="10"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.2"
                  />
                  <rect
                    x="4.5"
                    y="4.5"
                    width="5"
                    height="5"
                    rx="1"
                    stroke="currentColor"
                    stroke-width="1"
                    opacity=".5"
                  />
                </svg>
                <input type="number" id="padAll" min="0" max="2000" step="8" aria-label="Padding" />
              </div>
            </div>
            <div class="fig-chip-row" id="padChips"></div>
          </div>

          <div class="fig-stack" id="padMulti" hidden>
            <div class="fig-row">
              <div class="fig-field">
                <span class="fig-field__affix" aria-hidden="true">T</span>
                <input
                  type="number"
                  id="padTop"
                  min="0"
                  max="2000"
                  step="8"
                  aria-label="Padding top"
                />
              </div>
              <div class="fig-field">
                <span class="fig-field__affix" aria-hidden="true">R</span>
                <input
                  type="number"
                  id="padRight"
                  min="0"
                  max="2000"
                  step="8"
                  aria-label="Padding right"
                />
              </div>
              <div class="fig-field">
                <span class="fig-field__affix" aria-hidden="true">B</span>
                <input
                  type="number"
                  id="padBottom"
                  min="0"
                  max="2000"
                  step="8"
                  aria-label="Padding bottom"
                />
              </div>
              <div class="fig-field">
                <span class="fig-field__affix" aria-hidden="true">L</span>
                <input
                  type="number"
                  id="padLeft"
                  min="0"
                  max="2000"
                  step="8"
                  aria-label="Padding left"
                />
              </div>
            </div>
            <div class="fig-chip-row" id="padSideChips"></div>
          </div>
        </section>

        <section class="fig-group" id="gridGroup" hidden>
          <div class="fig-label">Grid</div>
          <div class="fig-row">
            <div class="fig-field">
              <span class="fig-field__affix" aria-hidden="true">C</span>
              <input
                type="number"
                id="gridColumns"
                min="0"
                max="20"
                step="1"
                placeholder="Auto"
                aria-label="Columns"
              />
            </div>
            <div class="fig-field">
              <span class="fig-field__affix" aria-hidden="true">R</span>
              <input
                type="number"
                id="gridRows"
                min="0"
                max="20"
                step="1"
                placeholder="Auto"
                aria-label="Rows"
              />
            </div>
            <label class="fig-check">
              <input type="checkbox" id="gridWrap" />
              <span class="fig-check__box" aria-hidden="true">
                <svg viewBox="0 0 10 10" fill="none">
                  <path
                    d="M2 5.5 4 7.5 8 3"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              Wrap
            </label>
          </div>
        </section>
      </div>

      <footer class="fig-footer">
        <button type="button" class="fig-btn fig-btn--primary" id="apply">Apply</button>
      </footer>
    </div>

    <div class="fig-overlay" id="settingsView" hidden>
      <header class="fig-header">
        <button type="button" class="fig-btn fig-btn--icon" id="closeSettings" title="Back">
          <span class="fig-sr-only">Back</span>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path
              d="M9 3L5 7l4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="fig-header__title">Settings</h1>
      </header>
      <div class="fig-body">
        <section class="fig-group">
          <div class="fig-label">Custom gap values</div>
          <div class="fig-list" id="gapValueList"></div>
        </section>
        <section class="fig-group">
          <div class="fig-label">Custom padding values</div>
          <div class="fig-list" id="padValueList"></div>
        </section>
      </div>
    </div>

    <!--inject:js-->
  </body>
</html>
